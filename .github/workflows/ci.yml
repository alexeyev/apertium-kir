name: CI

# Build the Kyrgyz transducers and run the test suites on every push and PR.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & morphophonology tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apertium toolchain
        run: |
          sudo apt-get -qy update
          sudo apt-get -qfy install wget ca-certificates
          wget -q https://apertium.projectjj.com/apt/install-nightly.sh -O - | sudo bash
          sudo apt-get -qfy install --no-install-recommends \
            apertium-all-dev hfst python3-libhfst

      - name: Build (autogen + make)
        run: |
          ./autogen.sh
          make -j2 V=1

      - name: Regression tests (apertium-regtest)
        # Report-only for now: the committed regtest corpus may lag behind the
        # transducer. The morphophonology and transliteration suites below are
        # the enforced gates.
        run: make test || echo "::warning::apertium-regtest reported failures (non-blocking)"

      - name: Morphophonology tests
        working-directory: tests/morphophonology
        run: python3 test.py kir

  transliteration:
    name: Transliteration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HFST
        run: |
          sudo apt-get -qy update
          sudo apt-get -qfy install wget ca-certificates
          wget -q https://apertium.projectjj.com/apt/install-nightly.sh -O - | sudo bash
          sudo apt-get -qfy install --no-install-recommends hfst

      - name: Build Cyrillic->Latin and Cyrillic->Arabic transducers
        working-directory: dev/ortho
        run: make -j2 cyr-lat.ohfst cyr-ara.ohfst

      - name: Cyrillic <-> Latin/Arabic transliteration tests
        working-directory: tests/transliteration
        run: python3 test.py
